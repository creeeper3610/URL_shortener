<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>完全インブラウザ Go WASM サーバー</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .card { background: #f8f9fa; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    button { padding: 10px 18px; font-size: 15px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 4px; }
    button:disabled { background: #ccc; }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/tinygo-org/tinygo@v0.31.0/targets/wasm_exec.js"></script>
  <!-- インブラウザGoコンパイラ（Go1.x/TinyGo WASMビルド）のローダー -->
  <script src="https://cdn.jsdelivr.net/npm/go-in-browser-compiler@latest/dist/compiler.js"></script>
</head>
<body>

  <h1>🚀 完全ローカル WASM Go サーバー</h1>
  
  <div class="card">
    <h3>サーバー状態</h3>
    <div id="status">⚙️ ブラウザ内Goコンパイラを準備中...</div>
  </div>

  <div class="card">
    <h3>URL短縮</h3>
    <input type="url" id="longUrl" placeholder="https://example.com/path" style="width:70%; padding:8px;">
    <button id="shortenBtn" onclick="requestShorten()" disabled>短縮URLを発行</button>
    <ul id="urlList"></ul>
  </div>

  <!-- 画面に表示されないGoコード -->
  <script id="go-source-code" type="text/text-go" style="display: none;">
package main

import (
	"crypto/rand"
	"encoding/hex"
	"syscall/js"
)

var store = make(map[string]string)

func generateID() string {
	b := make([]byte, 3)
	rand.Read(b)
	return hex.EncodeToString(b)
}

func handleShorten(this js.Value, args []js.Value) interface{} {
	if len(args) < 1 { return "" }
	id := generateID()
	store[id] = args[0].String()
	return id
}

func handleResolve(this js.Value, args []js.Value) interface{} {
	if len(args) < 1 { return "" }
	if target, exists := store[args[0].String()]; exists {
		return target
	}
	return ""
}

func main() {
	js.Global().Set("__go_server_shorten", js.FuncOf(handleShorten))
	js.Global().Set("__go_server_resolve", js.FuncOf(handleResolve))
	select {}
}
  </script>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const statusEl = document.getElementById("status");
      
      try {
        const goCode = document.getElementById("go-source-code").textContent;
        statusEl.innerText = "⏳ ブラウザ内でGoコードをコンパイル中...";

        // 外部サーバーを使わず、ブラウザ上のWASMコンパイラで直接バイナリ生成！
        const wasmBuffer = await GoCompiler.compile(goCode);

        // コンパイルされたWASMを起動してGoサーバーを常駐
        const go = new Go();
        const wasmModule = await WebAssembly.instantiate(wasmBuffer, go.importObject);
        go.run(wasmModule.instance);

        statusEl.innerHTML = "<span style='color:green;'>✅ ブラウザ内コンパイル完了＆Goサーバー起動！</span>";
        document.getElementById("shortenBtn").disabled = false;

      } catch (err) {
        statusEl.innerText = "❌ エラー: " + err.message;
      }
    });

    function requestShorten() {
      const input = document.getElementById("longUrl");
      if (!input.value) return;

      const key = window.__go_server_shorten(input.value);
      const shortURL = `${window.location.origin}${window.location.pathname}#${key}`;
      
      const li = document.createElement("li");
      li.innerHTML = `<a href="${shortURL}" target="_blank">${shortURL}</a> ➔ ${input.value}`;
      document.getElementById("urlList").appendChild(li);

      input.value = "";
    }

    window.addEventListener("hashchange", checkRedirect);
    function checkRedirect() {
      const key = window.location.hash.replace("#", "");
      if (key && typeof window.__go_server_resolve === "function") {
        const target = window.__go_server_resolve(key);
        if (target) window.location.href = target;
      }
    }
    setTimeout(checkRedirect, 500);
  </script>
</body>
</html>
