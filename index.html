<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インブラウザ WASM Go サーバー URL短縮機</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; line-height: 1.6; }
    .card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input[type="url"] { width: 70%; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 18px; font-size: 15px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 4px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status { font-weight: bold; margin-top: 10px; }
    .success { color: #2e7d32; }
    ul { padding-left: 20px; word-break: break-all; }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/tinygo-org/tinygo@v0.31.0/targets/wasm_exec.js"></script>
</head>
<body>

  <h1>🚀 WASM Go サーバー URL短縮アプリ</h1>
  
  <div class="card">
    <h3>サーバー状態</h3>
    <div id="status" class="status">⚡ Goサーバーをビルド＆起動中...</div>
  </div>

  <div class="card">
    <h3>URL短縮フォーム</h3>
    <input type="url" id="longUrl" placeholder="https://example.com/very/long/url">
    <button id="shortenBtn" onclick="requestShorten()" disabled>短縮URLを発行</button>

    <h4>発行済みURL一覧:</h4>
    <ul id="urlList"></ul>
  </div>

  <script id="go-source-code" type="text/text-go" style="display: none;">
package main

import (
	"crypto/rand"
	"encoding/hex"
	"syscall/js"
)

// メモリ内のURLデータベース
var store = make(map[string]string)

func generateID() string {
	b := make([]byte, 3)
	rand.Read(b)
	return hex.EncodeToString(b)
}

// HTTPリクエストを受け取るGoサーバーハンドラー（/shorten）
func handleShorten(this js.Value, args []js.Value) interface{} {
	if len(args) < 1 {
		return ""
	}
	longURL := args[0].String()
	id := generateID()
	store[id] = longURL
	return id
}

// HTTPリクエストを受け取るGoサーバーハンドラー（/resolve）
func handleResolve(this js.Value, args []js.Value) interface{} {
	if len(args) < 1 {
		return ""
	}
	id := args[0].String()
	if target, exists := store[id]; exists {
		return target
	}
	return ""
}

func main() {
	// JavaScript側にサーバーのAPIエンドポイント（関数）を公開・マウント
	js.Global().Set("__go_server_shorten", js.FuncOf(handleShorten))
	js.Global().Set("__go_server_resolve", js.FuncOf(handleResolve))

	// サーバーを常駐稼働（ブロック）させる
	select {}
}
  </script>

  <script>
    // 画面ロード時に自動でコンパイル＆Goサーバーを起動！
    window.addEventListener("DOMContentLoaded", async () => {
      const statusEl = document.getElementById("status");
      
      try {
        // body内の<script>からGoのソースコードを読み込む（画面には出ないよ！）
        const goCode = document.getElementById("go-source-code").textContent;

        // インブラウザコンパイル（TinyGo API）
        const res = await fetch("https://play.tinygo.org/compile", {
          method: "POST",
          body: goCode
        });

        if (!res.ok) throw new Error("コンパイル失敗");

        const wasmBuffer = await res.arrayBuffer();

        // Go WASM サーバーをインスタンス化してバックグラウンドで起動！
        const go = new Go();
        const wasmModule = await WebAssembly.instantiate(wasmBuffer, go.importObject);
        go.run(wasmModule.instance);

        statusEl.innerHTML = "<span class='success'>✅ Go Webサーバーがブラウザ内で正常起動しました！</span>";
        document.getElementById("shortenBtn").disabled = false;

      } catch (err) {
        statusEl.innerText = "❌ 起動エラー: " + err.message;
      }
    });

    // GoサーバーへURL短縮のリクエストを送信
    function requestShorten() {
      const input = document.getElementById("longUrl");
      const url = input.value;
      if (!url) return;

      // バックグラウンドで動くGoサーバーの処理を実行
      const key = window.__go_server_shorten(url);
      
      const shortURL = `${window.location.origin}${window.location.pathname}#${key}`;
      
      const li = document.createElement("li");
      li.innerHTML = `<a href="${shortURL}" target="_blank">${shortURL}</a> ➔ ${url}`;
      document.getElementById("urlList").appendChild(li);

      input.value = "";
    }

    // ハッシュ付きアクセス時にGoサーバーへ元のURLを問い合わせて転送
    window.addEventListener("hashchange", checkRedirect);
    function checkRedirect() {
      const key = window.location.hash.replace("#", "");
      if (key && typeof window.__go_server_resolve === "function") {
        const target = window.__go_server_resolve(key);
        if (target) {
          window.location.href = target;
        }
      }
    }
    // 初回読み込み時もチェック
    setTimeout(checkRedirect, 500);
  </script>
</body>
</html>
